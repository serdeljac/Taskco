services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TASKCO_APP_PASSWORD: ${TASKCO_APP_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

volumes:
  pgdata: